<!DOCTYPE html>
<html>
<head>

<title>Login</title>

<style>

body {
    margin: 0;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #f5f6fa;

    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

.card {

    width: 350px;

    background: white;

    padding: 40px;

    border-radius: 24px;

    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

h1 {
    margin-top: 0;
    margin-bottom: 30px;
}

input {

    width: 100%;

    padding: 12px;

    margin-bottom: 15px;

    border-radius: 12px;

    border: 1px solid #ddd;

    font-size: 14px;
}

button {

    width: 100%;

    padding: 12px;

    border: none;

    border-radius: 12px;

    background: #007aff;

    color: white;

    font-size: 14px;

    cursor: pointer;
}

button:hover {
    background: #005fdb;
}

.errorlist {
    color: red;
}

.helptext {
    display: none;
}

ul {
    padding-left: 20px;
}

</style>

</head>

<body>

<div class="card">

<h1>🍎 Login</h1>

<form method="post">

{% csrf_token %}

{{ form.as_p }}

<button type="submit">
Login
</button>

</form>

</div>

</body>
</html>
